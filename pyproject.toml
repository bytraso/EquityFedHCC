[build-system]
requires = ["setuptools==69.1.1", "wheel==0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equityfedhcc"
version = "1.0.0"
description = "Federated multimodal liver cancer risk modeling"
requires-python = ">=3.10,<3.12"
dependencies = [
  "torch==2.2.0",
  "numpy==1.26.4",
  "pandas==2.2.0",
  "scikit-learn==1.4.0",
  "PyYAML==6.0.1",
  "flwr==1.6.0",
  "transformers==4.38.0",
  "monai==1.4.0",
  "nibabel==5.2.1",
  "pydicom==2.4.4",
  "lifelines==0.28.0"
]

[project.scripts]
equityfedhcc-train = "equityfedhcc.commands.train:main"
equityfedhcc-evaluate = "equityfedhcc.commands.evaluate:main"
equityfedhcc-prepare = "equityfedhcc.commands.prepare:main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "no-any-return", "no-untyped-call"]
